 <div class="box"><b>Order Summary</b>${items.map(i=>{const l=line(i);return `<div class="ci"><img src="${l.v.img}"><div style="flex:1">${l.p.name}<br><small>Color: ${i.color} · Size: ${i.size} · Qty ${i.qty} · ${rs(l.price)}</small></div>${rs(l.tot)}</div>`}).join("")}</div>${tb(s)}<p class="err" id="er">${msg}</p><button class="btn g" onclick="place('${A}')">Confirm Order</button>`}
function place(mode){const g=k=>$("#"+k).value.trim();window.F={n:g("n"),p:g("p"),w:g("w"),a:g("a"),c:g("c"),ar:g("ar"),z:g("z"),no:g("no")};const F=window.F,ph=/^(03\d{9}|\+?923\d{9})$/;let e="";
 if(!F.n)e="Full name is required.";else if(!ph.test(F.p.replace(/[\s-]/g,"")))e="Enter a valid phone number (e.g. 03XXXXXXXXX).";else if(F.w&&!ph.test(F.w.replace(/[\s-]/g,"")))e="Enter a valid WhatsApp number.";else if(!F.a)e="Complete address is required.";else if(!F.c)e="City is required.";
 const items=mode=="buy"?lastBuy:cart;for(const i of items){const a=vr(pid(i.pid),i.color).stock[i.size];if(i.qty<1||i.qty>a)e="Not enough stock for "+pid(i.pid).name+" ("+i.color+"/"+i.size+").";}
 if(e){msg=e;$("#er").textContent=e;return}
 const dt=new Date(),ds=dt.getFullYear()+String(dt.getMonth()+1).padStart(2,"0")+String(dt.getDate()).padStart(2,"0"),all0=ls.get("orders",[]);let n=ls.get("oc"+ds,0)+1,oid;do{oid="ORD-"+ds+"-"+String(n).padStart(3,"0");n++}while(all0.some(x=>x.id==oid));ls.set("oc"+ds,n-1);const s=sums(items);items.forEach(i=>{vr(pid(i.pid),i.color).stock[i.size]-=i.qty});
 const o={id:oid,date:new Date().toLocaleString("en-PK"),f:F,pay:document.querySelector("[name=pm]:checked").value,items:items.map(i=>({...i,name:pid(i.pid).name,sku:pid(i.pid).sku,price:line(i).price})),s,status:0,pn:norm(F.p),wn:norm(F.w||F.p),ts:dt.toISOString()};
 const all=ls.get("orders",[]);all.push(o);ls.set("orders",all);if(mode!="buy"){cart=[];save()}window.F=null;lastOrder=o;ls.set("last",{id:o.id,p:o.pn});go("done");setTimeout(()=>{location.href=wal(wtxt(o))},2500)}
const STAT=["Pending WhatsApp Confirmation","Order Confirmed","Processing","Packed","Shipped","Out for Delivery","Delivered"];
function wtxt(o){return `NEW ORDER\n\nOrder ID: ${o.id}\n\nCustomer:\nName: ${o.f.n}\nPhone: ${o.f.p}\nWhatsApp: ${o.f.w||o.f.p}\nAddress: ${o.f.a}\nCity: ${o.f.c}\nPostal Code: ${o.f.z||"-"}\n\nITEMS:\n`+o.items.map(i=>`Product: ${i.name}\nColor: ${i.color}\nSize: ${i.size}\nQty: ${i.qty}\nPrice: ${rs(i.price)}\nTotal: ${rs(i.price*i.qty)}\n`).join("\n")+`\nSubtotal: ${rs(o.s.sub)}\nDelivery: ${rs(o.s.del)}\nDiscount: ${rs(o.s.disc)}\nTOTAL: ${rs(o.s.grand)}\n\nPayment Method:\n${o.pay}\n\nOrder Notes:\n${o.f.no||"-"}\n\nPlease confirm my order.`}
function done(){const o=lastOrder;return `<div class="np"><h1>Order Placed Successfully!</h1><p>Order ID: <b>${o.id}</b> · Status: <b>Pending WhatsApp Confirmation</b></p><p><a class="btn g b" href="${wal(wtxt(o))}">Send Order on WhatsApp</a> <button class="btn o" onclick="go('track')">Track Order</button> <button class="btn o" onclick="print()">Download / Print Invoice</button> <button class="btn o" onclick="go('home')">Continue Shopping</button></p><p class="err" style="color:var(--mu)">Your order details are ready. Please send the WhatsApp message to confirm your order.</p></div>
 <div class="box" id="inv"><div style="display:flex;gap:10px;align-items:center"><img src="${IM.logo}" style="width:64px;border-radius:50%"><div><b>${CFG.store}</b><br><small>${CFG.phone} · WhatsApp ${CFG.waShow} · ${CFG.email}</small></div></div><h2>Invoice ${o.id}</h2><small>${o.date}</small>
 <p><b>${o.f.n}</b> · ${o.f.p}<br>${o.f.a}, ${o.f.c}</p><div class="sc"><table><tr><th>Product</th><th>Color</th><th>Size</th><th>Qty</th><th>Unit</th><th>Total</th></tr>${o.items.map(i=>`<tr><td>${i.name}</td><td>${i.color}</td><td>${i.size}</td><td>${i.qty}</td><td>${rs(i.price)}</td><td>${rs(i.price*i.qty)}</td></tr>`).join("")}</table></div>${tb(o.s)}<p>Payment: <b>${o.pay}</b></p><p>Thank you for shopping with ${CFG.store}!</p></div>`}
function track(){return `<h1>Track Order</h1><div class="box f"><label>Order ID<input id="to" placeholder="ORD-20261001-001" value="${ls.get("last",{}).id||""}"></label><label>Phone Number<input id="tp" placeholder="03XXXXXXXXX" value="${ls.get("last",{}).p||""}"></label><button class="btn g" onclick="doT()">Track</button></div><div id="tr"></div>`}
function doT(){const o=ls.get("orders",[]).find(x=>x.id==$("#to").value.trim().toUpperCase()&&(x.pn||norm(x.f.p))==norm($("#tp").value));
 $("#tr").innerHTML=o?`<div class="box"><b>${o.id}</b> · ${o.date}<p>Current status: <b>${o.status=="Cancelled"?"Cancelled":STAT[o.status]}</b></p>`+(o.status=="Cancelled"?`<p class="err">Cancelled</p>`:`<div class="tl">${STAT.map((s,i)=>`<div class="${i<=o.status?"d":""}">${s}</div>`).join("")}</div>`)+o.items.map(i=>`<div class="row"><span>${i.name} (${i.color} / ${i.size}) × ${i.qty}</span></div>`).join("")+`</div>`:`<p class="err">Order not found. Please check your Order ID and phone number.</p>`}
function contact(){return `<h1>Contact Us</h1><div class="box"><p>Email: <a href="mailto:${CFG.email}">${CFG.email}</a></p><p>Contact: <a href="tel:+92${CFG.phone.slice(1)}">${CFG.phone}</a></p><p>WhatsApp: <a href="https://wa.me/${CFG.wa}">${CFG.waShow}</a></p><p>${CFG.city}</p><p><a class="btn g b" href="https://wa.me/${CFG.wa}?text=${encodeURIComponent("Hello, I would like to know more about your suits.")}">Chat on WhatsApp</a></p>${soc()}</div>`}
const soc=()=>`<p><a href="${CFG.fb}" target="_blank" rel="noopener">Facebook</a> · <a href="${CFG.ig}" target="_blank" rel="noopener">Instagram</a> · <a href="${CFG.yt}" target="_blank" rel="noopener">YouTube</a></p>`;
const NAV=[["home","Home"],["all","All Suits"],["2p","2-Piece Suits"],["3p","3-Piece Suits"],["new","New Arrivals"],["sale","Sale"],["about","About"],["contact","Contact"]];
function nav(k){q="";$("#hs").value="";$("#nv").classList.remove("open");if(k=="home"||k=="about"||k=="contact")go(k);else{pg=k;go("shop")}}
function sq(v){q=v;if(V!="shop"){pg="all";V="shop";A=null}render()}
const home=()=>`<div class="hero"><h1>${CFG.store}</h1><p>Elegant ready-made Pakistani women's suits. Cash on Delivery · WhatsApp Support</p><button class="btn g" onclick="nav('all')">Shop Now</button></div><div class="grid">${P.map(card).join("")}</div><div class="box" style="margin-top:14px"><b>Why shop with us:</b> Quality Products · Fast Delivery · Cash on Delivery · Easy Ordering · WhatsApp Support</div>`;
const about=()=>`<h1>About Us</h1><div class="box"><p>${CFG.store} — ${CFG.tag}. Ready-made Pakistani women's suits in one standard size. Based in ${CFG.city}.</p></div>`;
function render(){$("#app").innerHTML=({home,shop,prod,cart:cartV,checkout,done,track,contact,about})[V]();$("#cb").textContent="🛒 Cart ("+cart.reduce((a,c)=>a+c.qty,0)+")";document.title=CFG.store}
$("#hd").innerHTML=`<img src="${IM.logo}" alt="${CFG.store}" onclick="nav('home')"><input id="hs" class="hs" type="search" placeholder="🔍 Search products..." oninput="sq(this.value)"><button class="btn g" id="cb" onclick="nav('home');go('cart')"></button><button class="btn o mb" onclick="$('#nv').classList.toggle('open')">☰</button><nav id="nv">${NAV.map(([k,l])=>`<a onclick="nav('${k}')">${l}</a>`).join("")}<a onclick="go('track');$('#nv').classList.remove('open')">Track Order</a><a href="https://wa.me/${CFG.wa}">WhatsApp</a></nav>`;
$("#ft").innerHTML=`<b>${CFG.store}</b> — ${CFG.tag}<br>${CFG.phone} · ${CFG.email}${soc()}© 2026 ${CFG.store}`;
render();
</script></body></html>
